name: Release

# Publishes to npm when a version tag (vX.Y.Z) is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild spec and verify it is committed
        run: |
          npm run build-spec
          git diff --exit-code spec/controld-openapi.json \
            || (echo "::error::spec/controld-openapi.json is out of date" && exit 1)

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
